# Оверлей стека для сквозных тестов. Накладывается на compose.yml:
#
#   docker compose -p repibot-e2e \
#     --env-file frontend/apps/web/e2e/stack.env \
#     -f compose.yml -f frontend/apps/web/e2e/compose.e2e.yml \
#     --profile dev up -d --build --wait
#
# Пути внутри оверлея compose считает от каталога первого файла, то есть от
# корня репозитория. Проект отдельный (`-p repibot-e2e`): у прогона своя база,
# свой Valkey и свои контейнеры, обычный стек разработчика он не трогает.
#
# `!override` заменяет значение базового файла целиком. Без него compose
# дописал бы корневой .env к списку env_file, и прогон зависел бы от личных
# настроек: письма ушли бы на чужой SMTP, а ссылки указали бы на чужой домен.
# Заодно это снимает требование иметь .env вообще — в CI его нет.

x-e2e-env: &e2e-env
  env_file: !override [frontend/apps/web/e2e/stack.env]

services:
  migrate: *e2e-env
  api:
    <<: *e2e-env
    depends_on:
      remnawave-fake:
        condition: service_healthy
  worker:
    <<: *e2e-env
    depends_on:
      remnawave-fake:
        condition: service_healthy
  scheduler:
    <<: *e2e-env
    depends_on:
      remnawave-fake:
        condition: service_healthy

  remnawave-fake:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command:
      [
        "uvicorn",
        "repibot_core.testing.panel_server:panel_app",
        "--host",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    # Endpoint посева нужен Playwright на хосте, но не внешней сети машины.
    ports: ["127.0.0.1:3001:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  bot:
    <<: *e2e-env
    # Боту в сквозных сценариях делать нечего, а с подставным токеном он падал
    # бы в перезапуск и не дал бы дождаться готовности стека. Контейнер всё же
    # поднимается пустым: nginx объявляет его своей зависимостью.
    command: ["sleep", "infinity"]

  # Порты сдвинуты, чтобы прогон не спорил за 80, 3000 и 8025 с обычным стеком:
  # сквозные тесты можно запускать, не останавливая свою разработку.
  nginx:
    ports: !override ["8081:80"]

  mailpit:
    ports: !override ["8026:8025"]
