[project]
name = "repibot"
version = "0.1.0"
description = "Re:Pibot Shop — магазин VPN-подписок поверх Remnawave"
requires-python = ">=3.13"
dependencies = ["repibot-core", "repibot-api", "repibot-bot", "repibot-worker"]

[project.scripts]
build-brand = "tools.brand.build:main"
check = "tools.check:main"
export-openapi = "tools.export_openapi:main"
verify-generated = "tools.verify_generated:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.uv.workspace]
members = ["backend/core", "backend/api", "backend/bot", "backend/worker"]

[tool.uv.sources]
repibot-core = { workspace = true }
repibot-api = { workspace = true }
repibot-bot = { workspace = true }
repibot-worker = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.9",
    # Кэш и лимиты проверяются без контейнера: их поведение не зависит от
    # особенностей сервера, а Postgres в тестах и без того поднимается.
    "fakeredis>=2.26",
    "httpx>=0.28",
    "datamodel-code-generator>=0.26",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "fonttools[woff]>=4.55",
    "uharfbuzz>=0.45",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Ruff 0.16 форматирует Python-блоки внутри Markdown. Спеки и планы — не исходники,
# примеры в них живут по правилам изложения, а не по правилам линтера.
extend-exclude = ["docs", "**/integrations/remnawave/models.py", "tools/brand/wordmark_paths.py"]
src = ["backend/core/src", "backend/api/src", "backend/bot/src", "backend/worker/src", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S", "T20"]
# RUF001–003 ловят кириллицу как «неоднозначные» символы: правило рассчитано на
# латиничные исходники. Документация проекта на русском по решению из плана.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S106"]
"**/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend", "tools", "conftest.py"]
exclude = "(migrations|integrations/remnawave/models\\.py)"

# Ни fontTools, ни uharfbuzz не поставляют разметку типов.
[[tool.mypy.overrides]]
module = ["fontTools.*", "uharfbuzz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend", "tools"]
asyncio_mode = "auto"
markers = ["docker: требует запущенный Docker (testcontainers)"]
