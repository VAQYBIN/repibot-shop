[project]
name = "repibot-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # email — схема панели содержит поля EmailStr, генератор моделей их использует
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # Синхронный драйвер нужен Alembic — он ходит в базу отдельным процессом.
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    # HTTP-обёртка FakePanel запускается отдельным ASGI-сервисом в e2e-стеке.
    "starlette>=0.47",
    "tenacity>=9.0",
    # Пароли, токены доступа и подписи одноразовых ссылок.
    "argon2-cffi>=23.1",
    # crypto: свой access-токен подписан HS256 и обошёлся бы без него, но
    # ID-токен Telegram приходит с RS256, ES256 или EdDSA — без cryptography
    # PyJWT такую подпись не проверит.
    "pyjwt[crypto]>=2.10",
    # Письма: отправка и шаблоны.
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    # Кэш роли, лимиты запросов и очередь. Брокер живёт в core: задачу ставит
    # не только воркер, но и api — письмо должно уходить сразу после регистрации.
    "redis>=5.2",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    # Passkey: разбор CBOR, ключей COSE и проверка подписей аутентификатора.
    # Писать это руками — переписывать половину спецификации WebAuthn.
    "webauthn>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repibot_core"]
