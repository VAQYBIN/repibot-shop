[project]
name = "repibot-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # email — схема панели содержит поля EmailStr, генератор моделей их использует
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # Синхронный драйвер нужен Alembic — он ходит в базу отдельным процессом.
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repibot_core"]
