[project]
name = "repibot-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["repibot-core", "fastapi>=0.115", "uvicorn[standard]>=0.34", "redis>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repibot_api"]
