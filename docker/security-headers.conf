# Общий набор заголовков безопасности.
#
# Вынесен в отдельный файл не ради красоты: add_header внутри location
# ЗАМЕНЯЕТ весь набор, унаследованный от server, а не дополняет его. Локация,
# объявившая хотя бы один свой заголовок, теряет остальные — и HSTS исчезает
# ровно на тех страницах, где он и нужен. Поэтому каждая такая локация
# подключает этот файл заново.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
