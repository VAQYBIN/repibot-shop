upstream api_upstream { server api:8000; }
upstream bot_upstream { server bot:8080; }
upstream web_upstream { server web:3000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # TLS терминирует внешний прокси, до nginx запрос доходит по http.
    # Без этого redirect на каталог собирается как http://домен/путь/ и
    # уводит пользователя с https на открытый http.
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    # MiniApp. Внутри Telegram страница открывается во фрейме клиента,
    # поэтому X-Frame-Options здесь неприменим — ограничение задаётся
    # через frame-ancestors. script-src сужен до telegram.org: SDK
    # загружается оттуда и подписать его через integrity нельзя.
    #
    # Локация со слешем: без него /appfoo тоже попадал бы сюда и затенял
    # будущие маршруты веб-приложения, начинающиеся на app.
    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
    }

    location = /app {
        return 301 /app/;
    }

    # Проверка живости живёт в корне, а не под /api: её опрашивают внешние
    # наблюдатели, которым незачем знать внутреннее устройство путей.
    location = /health {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location /api {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Входящие вебхуки сгруппированы под общим префиксом: /webhook/<источник>.
    # Следующим сюда встанет /webhook/yookassa — он пойдёт в api, а не в bot,
    # поэтому маршруты объявляются поимённо, а не одним префиксом.
    #
    # Секрета в пути нет: URL целиком пишется в журнал доступа и в любой
    # промежуточный прокси. Подлинность запроса подтверждает заголовок
    # X-Telegram-Bot-Api-Secret-Token, его проверяет aiogram.
    location = /webhook/telegram {
        proxy_pass http://bot_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Событие панели подтверждается HMAC-подписью тела; имя заголовка задаётся
    # в её настройках и переносится в REMNAWAVE_WEBHOOK_HEADER.
    location = /webhook/remnawave {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
    }
}
