server {
    listen 80;
    server_name _;

    # Docker выдаёт пересозданному контейнеру новый адрес, а имя из upstream
    # nginx разрешает один раз при старте и держит вечно: после обновления
    # api весь /api отвечает 502, пока не перезапустишь и nginx. Поэтому имена
    # разрешаются в момент запроса — через переменную в proxy_pass, — а
    # встроенный DNS Docker'а живёт по постоянному адресу.
    #
    # Плата за переменную: nginx перестаёт подставлять путь сам, и он
    # передаётся явно через $request_uri.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 8m;

    # TLS терминирует внешний прокси, до nginx запрос доходит по http.
    # Без этого redirect на каталог собирается как http://домен/путь/ и
    # уводит пользователя с https на открытый http.
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    # MiniApp. Внутри Telegram страница открывается во фрейме клиента,
    # поэтому X-Frame-Options здесь неприменим — ограничение задаётся
    # через frame-ancestors. script-src сужен до telegram.org: SDK
    # загружается оттуда и подписать его через integrity нельзя.
    #
    # Локация со слешем: без него /appfoo тоже попадал бы сюда и затенял
    # будущие маршруты веб-приложения, начинающиеся на app.
    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;

        # Точка входа называет файлы сборки по именам с хешем и потому не
        # должна переживать обновление. Без явного запрета браузер кеширует
        # её на своё усмотрение — по возрасту файла, — и клиент открывает
        # старую сборку неделями. Внутри Telegram это не лечится ни
        # перезаходом в приложение, ни обновлением страницы.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
    }

    # Имя файла содержит хеш содержимого: новая сборка — новое имя, поэтому
    # старое содержимое можно хранить сколько угодно. try_files здесь не нужен:
    # пропавший файл должен дать 404, а не страницу приложения.
    location /app/assets/ {
        alias /usr/share/nginx/html/app/assets/;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /app {
        return 301 /app/;
    }

    # Проверка живости живёт в корне, а не под /api: её опрашивают внешние
    # наблюдатели, которым незачем знать внутреннее устройство путей.
    location = /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location /api {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Входящие вебхуки сгруппированы под общим префиксом: /webhook/<источник>.
    # Следующим сюда встанет /webhook/yookassa — он пойдёт в api, а не в bot,
    # поэтому маршруты объявляются поимённо, а не одним префиксом.
    #
    # Секрета в пути нет: URL целиком пишется в журнал доступа и в любой
    # промежуточный прокси. Подлинность запроса подтверждает заголовок
    # X-Telegram-Bot-Api-Secret-Token, его проверяет aiogram.
    location = /webhook/telegram {
        set $bot_upstream http://bot:8080;
        proxy_pass $bot_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Событие панели подтверждается HMAC-подписью тела; имя заголовка задаётся
    # в её настройках и переносится в REMNAWAVE_WEBHOOK_HEADER.
    location = /webhook/remnawave {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # YooKassa sends an untrusted identifier hint. The API fetches provider
    # truth itself, so this route must preserve the same narrow ingress path
    # as the signed panel webhook rather than falling through to Next.js.
    location = /webhook/yookassa {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Свой лендинг развернувшего.
    #
    # Каталог монтируется томом только для чтения. Файла нет — try_files
    # уходит в @web, и главную отдаёт приложение. Переключателя «включить
    # своё» намеренно нет: наличие index.html и есть переключатель, а
    # настройка, которую надо не забыть выставить, однажды не выставляется.
    location = / {
        root /srv/landing;
        try_files /index.html @web;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
    }

    # Стили, скрипты и картинки своей страницы.
    location /landing/ {
        alias /srv/landing/;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
    }

    # Запасной путь корневой локации: главную отдаёт приложение, когда своего
    # index.html не положили. Тело повторяет `location /` дословно — try_files
    # умеет уходить только в именованную локацию, а именованная не бывает
    # одновременно префиксной и обслуживать остальные адреса не может.
    location @web {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
    }
}
